name: Temporary Reactor V3 Launch Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'impossible-reactor/**'
      - '.github/workflows/tmp-reactor-v3-test.yml'

jobs:
  build-and-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: impossible-reactor
        run: gradle :app:assembleDebug --stacktrace

      - name: Install and launch in Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r impossible-reactor/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.oryx.impossiblereactor
            adb logcat -c
            adb shell am start -W -n com.oryx.impossiblereactor/.MainActivity
            sleep 4
            PID=$(adb shell pidof com.oryx.impossiblereactor | tr -d '\r')
            echo "APP_PID=$PID"
            test -n "$PID"
            adb shell dumpsys activity activities | grep -F "com.oryx.impossiblereactor/.MainActivity"
            if adb logcat -d '*:E' | grep -E "FATAL EXCEPTION|AndroidRuntime" | grep -F "com.oryx.impossiblereactor"; then
              echo "Runtime crash detected"
              exit 1
            fi

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: impossible-reactor-v3-tested-apk
          path: impossible-reactor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

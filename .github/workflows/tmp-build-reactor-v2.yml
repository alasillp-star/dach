name: Temporary Build Reactor V2

on:
  pull_request:
    branches: [main]
    paths:
      - 'impossible-reactor/**'
      - '.github/workflows/tmp-build-reactor-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: impossible-reactor
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: impossible-reactor-v2-apk
          path: impossible-reactor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

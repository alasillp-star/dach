name: Meta Winning Products Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'keywords.txt'
      - 'countries.txt'
      - 'requirements.txt'
      - '.github/workflows/meta-scanner.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          MIN_DAYS: '14'
          PAIRS_PER_RUN: '12'
          MAX_RESULTS_PER_PAIR: '40'
        run: python scanner.py

      - name: Commit updated results
        run: |
          git config user.name "meta-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/winning_ads.csv data/scanner_state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update winning ads scan"
            git push
          fi

name: Arabic Winning Products Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'scanner.py'
      - 'countries_ar.txt'
      - 'requirements.txt'
      - 'seed/**'
      - '.github/workflows/meta-scanner.yml'

permissions:
  contents: write

concurrency:
  group: arabic-winning-scanner
  cancel-in-progress: true

jobs:
  scan:
    # IMPORTANT: Meta rate-limits GitHub/Azure datacenter IPs.
    # A self-hosted runner uses the user's own network/IP instead.
    runs-on: self-hosted
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure Git publisher
        run: |
          git config user.name "arabic-meta-scanner"
          git config user.email "actions@users.noreply.github.com"

      - name: Continuous Arabic scan
        env:
          MIN_DAYS: '14'
          INTERVAL_SECONDS: '30'
          MAX_RESULTS: '20'
          RUN_SECONDS: '20400'
          STATE_PUSH_SECONDS: '600'
        run: python scanner.py

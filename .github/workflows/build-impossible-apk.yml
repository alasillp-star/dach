name: Build Impossible APK

on:
  workflow_dispatch:
  push:
    branches:
      - tmp-impossible-apk-20260821-2340
    paths:
      - 'impossible-game/**'
      - '.github/workflows/build-impossible-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: impossible-game
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: impossible-game-apk
          path: impossible-game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
